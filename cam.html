<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đang phát triển</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas,monospace;
}

body{
    background:#000;
    color:#00ff66;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
    width:90%;
    max-width:500px;
}

h1{
    font-size:28px;
    margin-bottom:20px;
    text-shadow:0 0 10px #00ff66;
}

p{
    font-size:18px;
    margin-bottom:40px;
}

button{
    width:100%;
    padding:15px;
    font-size:18px;
    font-weight:bold;
    background:#000;
    color:#00ff66;
    border:2px solid #00ff66;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#00ff66;
    color:#000;
    box-shadow:0 0 15px #00ff66;
}
</style>
</head>

<body>

<div class="container">
    <h1>⚠ ĐANG PHÁT TRIỂN ⚠</h1>

    <p>Tính năng này đang được phát triển.</p>

    <button onclick="location.href='menu.html'">
        ⬅ Quay lại Menu
    </button>
</div>

</body>
</html>
