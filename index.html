<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTeam Map</title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff00;
  font-family: monospace;
  text-align: center;
}

h1 {
  font-size: 24px;
  margin-top: 20px;
  text-shadow: 0 0 10px #00ff00;
}

#status {
  margin: 10px 0 15px;
  font-size: 14px;
}

#list {
  max-width: 500px;
  margin: auto;
  padding: 0 10px;
}

.item {
  border: 2px solid #00ff00;
  border-radius: 15px;
  padding: 12px;
  margin: 10px 0;
  font-size: 16px;
  text-align: left;
  color: white;
  box-shadow: 0 0 8px #00ff00;
  cursor: pointer;
}

.item:active {
  background: #00ff00;
  color: black;
}

#scanBtn {
  margin: 20px auto 30px;
  display: block;
  padding: 12px 20px;
  font-size: 16px;
  border: 2px solid #00ff00;
  border-radius: 20px;
  background: black;
  color: #00ff00;
  cursor: pointer;
  box-shadow: 0 0 10px #00ff00;
}

#scanBtn:active {
  background: #00ff00;
  color: black;
}
</style>
</head>

<body>

<h1>HTeam Map</h1>
<div id="status">Đang quét hotspot...</div>

<div id="list"></div>

<button id="scanBtn">🔄 Scan lại</button>

<script>
const GEMINI_API_KEY = "AIzaSyAnjhXXjS2KVPfyV5VsW_tMeJdUOCKWD8I";

let userLat, userLng;
let lastIds = [];

// ===== SHUFFLE =====
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

// ===== GPS =====
navigator.geolocation.getCurrentPosition(pos => {
  userLat = pos.coords.latitude;
  userLng = pos.coords.longitude;
  loadPlaces();
}, () => {
  document.getElementById("status").innerHTML = "Không lấy được GPS ❌";
});

// ===== SCAN BUTTON =====
document.getElementById("scanBtn").onclick = () => {
  document.getElementById("status").innerHTML = "Đang quét lại...";
  document.getElementById("list").innerHTML = "";
  loadPlaces();
};

// ===== LOAD DATA =====
async function loadPlaces() {

  const offset = (Math.random() - 0.5) * 0.002;
  const lat = userLat + offset;
  const lng = userLng + offset;

  const query = `
  [out:json];
  (
    node(around:1200,${lat},${lng})["amenity"="restaurant"];
    node(around:1200,${lat},${lng})["amenity"="cafe"];
    way(around:1200,${lat},${lng})["amenity"="restaurant"];
    way(around:1200,${lat},${lng})["amenity"="cafe"];
  );
  out center;
  `;

  try {
    const res = await fetch("https://overpass-api.de/api/interpreter", {
      method: "POST",
      body: query
    });

    const data = await res.json();

    let places = data.elements
      .filter(p => p.tags && p.tags.name)
      .slice(0, 40);

    shuffle(places);

    analyzeAI(places);

  } catch {
    document.getElementById("status").innerHTML = "Lỗi tải dữ liệu ❌";
  }
}

// ===== AI =====
async function analyzeAI(places) {

  const now = new Date();
  const timeString = now.toLocaleString("vi-VN");
  const randomSeed = Math.floor(Math.random() * 100000);

  const prompt = `
Thời gian: ${timeString}
Random seed: ${randomSeed}

Danh sách:
${places.map(p => `id:${p.id} - ${p.tags.name}`).join("\n")}

Yêu cầu:
- Chọn NGẪU NHIÊN 10 địa điểm
- Không trùng lần trước

Trả JSON:
[{"id":123}]
`;

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`,
      {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      }
    );

    const data = await res.json();
    let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";

    text = text.replace(/```json|```/g, "").trim();

    let aiList = JSON.parse(text);

    render(aiList, places);

  } catch {
    renderFallback(places);
  }
}

// ===== GET LAT LNG =====
function getLatLng(p) {
  return {
    lat: p.lat || p.center?.lat,
    lng: p.lon || p.center?.lon
  };
}

// ===== DISTANCE =====
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);

  return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(2);
}

// ===== RENDER =====
function render(aiList, raw) {
  const list = document.getElementById("list");
  list.innerHTML = "";

  let newIds = [];

  aiList.forEach((item) => {
    if (lastIds.includes(item.id)) return;

    const match = raw.find(p => p.id == item.id);
    if (!match) return;

    newIds.push(item.id);
    createItem(match, newIds.length - 1, list);
  });

  lastIds = newIds;

  if (list.innerHTML === "") {
    renderFallback(raw);
  } else {
    document.getElementById("status").innerHTML = "Hotspots mới ✔";
  }
}

// ===== FALLBACK =====
function renderFallback(raw) {
  const list = document.getElementById("list");
  list.innerHTML = "";

  raw.slice(0, 10).forEach((p, index) => {
    createItem(p, index, list);
  });

  document.getElementById("status").innerHTML = "Hiển thị ngẫu nhiên 📍";
}

// ===== ITEM =====
function createItem(p, index, list) {
  const {lat, lng} = getLatLng(p);
  if (!lat || !lng) return;

  const distance = getDistance(userLat, userLng, lat, lng);

  const div = document.createElement("div");
  div.className = "item";
  div.innerHTML = `${index + 1}. ${p.tags.name} (${distance} km)`;

  div.onclick = () => {
    const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
    window.open(url, "_blank");
  };

  list.appendChild(div);
}
</script>

</body>
</html>
