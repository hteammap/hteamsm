<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warning</title>

<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#000;
        font-family:Arial, sans-serif;
    }

    .warning-box{
        border:2px solid #00ff66;
        padding:30px 40px;
        border-radius:12px;
        text-align:center;
        box-shadow:0 0 20px #00ff66;
    }

    .warning-text{
        color:#00ff66;
        font-size:24px;
        font-weight:bold;
        text-shadow:0 0 10px #00ff66;
    }
</style>
</head>

<body>

<div class="warning-box">
    <div class="warning-text">
        WARNING<br><br>
        Hệ thống đang bảo trì để cập nhật
    </div>
</div>

</body>
</html>
