<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTeam Map</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: #00ff00;
      font-family: monospace;
      text-align: center;
    }

    /* ===== KEY SYSTEM ===== */

    #keyScreen {
      position: fixed;
      inset: 0;
      background: black;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #keyBox {
      width: 85%;
      max-width: 350px;
      border: 2px solid #00ff00;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 0 20px #00ff00;
      background: #000;
    }

    #keyBox h2 {
      margin: 0;
      color: #00ff00;
      text-shadow: 0 0 10px #00ff00;
    }

    #keyBox .ver {
      margin-top: 5px;
      color: #00ffaa;
      font-size: 14px;
      line-height: 1.5;
    }

    #keyBox .text {
      margin-top: 20px;
      margin-bottom: 10px;
      color: #00ff00;
    }

    #keyInput {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 12px;
      border: 2px solid #00ff00;
      background: black;
      color: #00ff00;
      outline: none;
      font-size: 15px;
      font-family: monospace;
      box-shadow: 0 0 10px #00ff00;
    }

    #keyInput::placeholder {
      color: #00aa00;
    }

    #keyBtn {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border-radius: 15px;
      border: 2px solid #00ff00;
      background: black;
      color: #00ff00;
      font-size: 16px;
      font-family: monospace;
      cursor: pointer;
      box-shadow: 0 0 10px #00ff00;
    }

    #keyBtn:active {
      background: #00ff00;
      color: black;
    }

    #keyStatus {
      margin-top: 12px;
      color: #00ffaa;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div id="keyScreen">
  <div id="keyBox">

    <h2>HTeam Map</h2>

    <div class="ver">
      Công cụ hỗ trợ điểm đứng nổ đơn cho tài xế xanh SM Bike<br>
      Đã cập nhật lựa chọn setup ngày và đêm<br>
      Admin: Nguyễn Việt Hùng<br>
      Zalo: 0387675932<br>
      Ver: 1.2.0
    </div>

    <div class="text">
      Nhập key để sử dụng:
    </div>

    <input type="text" id="keyInput" placeholder="Nhập key...">

    <button id="keyBtn">
      Xác nhận
    </button>

    <div id="keyStatus"></div>

  </div>
</div>

<script>

const KEY_FILE =
"https://raw.githubusercontent.com/hteammap/hteamsm/main/keys.json";

async function checkKey() {

  const key = document.getElementById("keyInput").value.trim();

  if (!key) {
    document.getElementById("keyStatus").innerHTML =
    "Vui lòng nhập key";
    return;
  }

  document.getElementById("keyStatus").innerHTML =
  "Đang kiểm tra key...";

  try {

    const res = await fetch(KEY_FILE);

    if (!res.ok) {
      throw new Error("Không tải được dữ liệu");
    }

    const data = await res.json();

    const found = data.keys.find(k => k.key === key);

    if (!found) {
      document.getElementById("keyStatus").innerHTML =
      "❌ Key không đúng";
      return;
    }

    const today = new Date();
    const expireDate = new Date(found.expire + "T23:59:59");

    if (today > expireDate) {
      document.getElementById("keyStatus").innerHTML =
      "❌ Key đã hết hạn";
      return;
    }

    document.getElementById("keyStatus").innerHTML =
    `✅ Key hợp lệ - HSD: ${found.expire}`;

    // Chỉ khi key hợp lệ mới chuyển sang menu.html
    setTimeout(() => {
      window.location.href = "menu.html";
    }, 1000);

  } catch (err) {

    document.getElementById("keyStatus").innerHTML =
    "❌ Lỗi kết nối server";

    console.error(err);

  }

}

document.getElementById("keyBtn").addEventListener("click", checkKey);

document.getElementById("keyInput").addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    checkKey();
  }
});

</script>

</body>
</html>
