<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTeam Map</title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff00;
  font-family: monospace;
  text-align: center;
}

/* TITLE */
h1 {
  font-size: 22px;
  margin-top: 15px;
  text-shadow: 0 0 10px #00ff00;
}

/* STATUS */
#status {
  margin: 10px 0;
  font-size: 14px;
}

/* BUTTON */
button {
  background: black;
  color: #00ff00;
  border: 2px solid #00ff00;
  padding: 10px 15px;
  border-radius: 10px;
  margin-bottom: 10px;
  font-size: 14px;
  cursor: pointer;
}

button:active {
  background: #00ff00;
  color: black;
}

/* LIST */
#list {
  max-width: 500px;
  margin: auto;
  padding: 0 10px;
}

.item {
  border: 2px solid #00ff00;
  border-radius: 15px;
  padding: 12px;
  margin: 10px 0;
  font-size: 15px;
  text-align: left;
  color: white;
  box-shadow: 0 0 8px #00ff00;
  cursor: pointer;
}

.item:active {
  background: #00ff00;
  color: black;
}
</style>
</head>

<body>

<h1>HTeam Map</h1>
<div id="status">Đang tìm hotspot...</div>
<button onclick="scan()">🔄 Scan lại</button>

<div id="list"></div>

<script>
const GEMINI_API_KEY = "AIzaSyAnjhXXjS2KVPfyV5VsW_tMeJdUOCKWD8I";

let userLat, userLng;

// ===== SCAN =====
function scan() {
  document.getElementById("status").innerHTML = "Đang quét lại...";
  document.getElementById("list").innerHTML = "";

  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    loadPlaces();
  }, () => {
    document.getElementById("status").innerHTML = "Không lấy được GPS ❌";
  });
}

// ===== LOAD DATA =====
async function loadPlaces() {
  const query = `
  [out:json];
  (
    node(around:1200,${userLat},${userLng})["amenity"="restaurant"];
    node(around:1200,${userLat},${userLng})["amenity"="cafe"];
    node(around:1200,${userLat},${userLng})["shop"];
  );
  out;
  `;

  try {
    const res = await fetch("https://overpass-api.de/api/interpreter", {
      method: "POST",
      body: query
    });

    const data = await res.json();
    const places = data.elements.filter(p => p.tags && p.tags.name).slice(0, 20);

    analyzeAI(places);

  } catch {
    document.getElementById("status").innerHTML = "Lỗi tải dữ liệu ❌";
  }
}

// ===== AI =====
async function analyzeAI(places) {
  const prompt = `
Danh sách địa điểm:

${places.map(p => `id:${p.id} - ${p.tags.name}`).join("\n")}

Chọn 5 địa điểm đông người nhất.

Trả JSON:
[{"id":123}]
`;

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`,
      {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      }
    );

    const data = await res.json();
    let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";

    text = text.replace(/```json|```/g, "").trim();

    let aiList = [];
    try {
      aiList = JSON.parse(text);
    } catch {
      renderFallback(places);
      return;
    }

    render(aiList, places);

  } catch {
    renderFallback(places);
  }
}

// ===== RENDER =====
function render(aiList, raw) {
  const list = document.getElementById("list");
  list.innerHTML = "";
  document.getElementById("status").innerHTML = "Hotspots found ✔";

  aiList.forEach((item, index) => {
    const match = raw.find(p => p.id == item.id);
    if (!match) return;

    createItem(match, index, list);
  });

  if (list.innerHTML === "") {
    renderFallback(raw);
  }
}

// ===== FALLBACK =====
function renderFallback(raw) {
  const list = document.getElementById("list");
  list.innerHTML = "";
  document.getElementById("status").innerHTML = "Hiển thị gần bạn 📍";

  raw.slice(0, 5).forEach((p, index) => {
    createItem(p, index, list);
  });
}

// ===== DISTANCE =====
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;
  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(2);
}

// ===== ITEM =====
function createItem(p, index, list) {
  const distance = getDistance(userLat, userLng, p.lat, p.lon);

  const div = document.createElement("div");
  div.className = "item";
  div.innerHTML = `${index + 1}. ${p.tags.name} (${distance} km)`;

  div.onclick = () => {
    const url = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;
    window.open(url, "_blank");
  };

  list.appendChild(div);
}

// chạy lần đầu
scan();
</script>

</body>
</html>
